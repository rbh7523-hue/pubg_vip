name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data.json"
      - "update_data.py"
      - ".github/workflows/update.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3"

      - name: Download Arabic font
        run: |
          sudo apt-get install -y fonts-noto-core || true
          pip install fonttools
          python get_font.py || true
          ls -la *.ttf || true

      - name: Build APK
        run: |
          java -version
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pubg-vip-apk
          path: bin/*.apk
